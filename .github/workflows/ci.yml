name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Cargo.toml sets pedantic and nursery; -D warnings makes them errors.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89 check --lib

  coverage:
    name: coverage (85 % lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --all-targets --fail-under-lines 85 --summary-only

  verus:
    name: Verus proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Verus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/verus"
          mkdir -p "$dir"
          # The newest release with a Linux asset.
          tag="$(gh api 'repos/verus-lang/verus/releases?per_page=30' \
            --jq '[.[] | select(any(.assets[]; .name | endswith("x86-linux.zip")))][0].tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::no Verus release has an x86-linux.zip asset"
            exit 1
          fi
          echo "Verus release: $tag"
          gh release download "$tag" --repo verus-lang/verus --pattern '*x86-linux.zip' --dir "$dir"
          unzip -q "$dir"/*.zip -d "$dir"
          verus_bin="$(find "$dir" -type f -name verus -perm -u+x | head -n 1)"
          if [ -z "$verus_bin" ]; then
            echo "::error::the Verus release asset has no verus binary"
            exit 1
          fi
          # Verus needs one exact Rust toolchain; its --version names it.
          out="$("$verus_bin" --version 2>&1)" || true
          version="$(printf '%s\n' "$out" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' | head -n 1 | cut -d- -f1)" || true
          if [ -n "$version" ]; then
            echo "Verus needs Rust $version"
            rustup toolchain install "$version" --profile minimal
          fi
          "$verus_bin" --version
          echo "VERUS_BIN=$verus_bin" >> "$GITHUB_ENV"
      - run: ./scripts/verify-verus.sh
