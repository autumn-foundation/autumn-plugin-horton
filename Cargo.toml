[package]
name = "autumn-plugin-horton"
version = "0.1.0"
edition = "2024"
# `std::fs::File::try_lock` (the single-process guard) is stable from 1.89.
rust-version = "1.97"
description = "Autumn plugin: an embedded, durable horton key-value store and session store"
license = "MIT OR Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-horton"
readme = "README.md"
keywords = ["autumn", "plugin", "key-value", "lsm", "session"]
categories = ["web-programming", "database-implementations"]
exclude = [".github/", "CLAUDE.md", "verification/", "docs/plan.md"]

[features]
# A fleet of horton stores: one store for each tenant or slot.
fleet = ["autumn-web/db", "dep:axum", "dep:http"]

[dependencies]
# Lean: the plugin uses only the always-on surfaces (plugin, actuator,
# session, config, test). The app's own features unify on top.
autumn-web = { version = "0.11.0", default-features = false }
# The fleet extractor (feature `fleet`).
axum = { version = "0.8", default-features = false, optional = true }
http = { version = "1", optional = true }
horton = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
autumn-web = { version = "0.11.0", default-features = false, features = ["plugin-conformance", "sqlite"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[package.metadata.docs.rs]
# `fleet` needs an Autumn database backend. The app selects it.
features = ["fleet", "autumn-web/sqlite"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# horton is generic over the device and its sizes, so its code compiles
# into this crate. Optimise dev builds, or a store test runs ~100x slower.
# Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 2

[[bench]]
name = "throughput"
harness = false
